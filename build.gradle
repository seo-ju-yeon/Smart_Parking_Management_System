plugins {
    id 'java'
    id 'war'
}

group 'org.example'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

ext {
    junitVersion = '5.10.2'
}

// 실행 환경과 관계없이 Java 17로 동일하게 빌드하기 위해 Toolchain을 고정
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

sourceCompatibility = '17'
targetCompatibility = '17'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

dependencies {
    compileOnly('jakarta.servlet:jakarta.servlet-api:6.0.0')

    testImplementation("org.junit.jupiter:junit-jupiter-api:${junitVersion}")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:${junitVersion}")

    // Lombok 라이브러리 추가 (컴파일 시 사용)
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    testCompileOnly 'org.projectlombok:lombok:1.18.30'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'

    // https://mvnrepository.com/artifact/org.mariadb.jdbc/mariadb-java-client
    implementation 'org.mariadb.jdbc:mariadb-java-client:3.5.3'

    // Log4j2 라이브러리 추가
    implementation 'org.apache.logging.log4j:log4j-api:2.25.0'
    implementation 'org.apache.logging.log4j:log4j-core:2.24.3'
    implementation 'org.slf4j:slf4j-api:2.0.7'
    implementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.24.3'

    // model Mapper
    // https://mvnrepository.com/artifact/org.modelmapper/modelmapper
    implementation("org.modelmapper:modelmapper:3.1.1")

    // Connection Pool
    // https://mvnrepository.com/artifact/com.zaxxer/HikariCP
    implementation("com.zaxxer:HikariCP:5.0.1")

    //메일 발송을 위한 api
    // Source: https://mvnrepository.com/artifact/jakarta.mail/jakarta.mail-api
    implementation 'jakarta.mail:jakarta.mail-api:2.1.3'
    // Jakarta Mail API + Implementation (Angus Mail)
    implementation 'org.eclipse.angus:jakarta.mail:2.0.4'

    // naver 메일, 의존성 추가
//    implementation 'com.sun.mail:jakarta.mail:2.0.1'

    //암호화 기능
    // Source: https://mvnrepository.com/artifact/org.mindrot/jbcrypt
    implementation 'org.mindrot:jbcrypt:0.4'

    // XSS 방지를 위한 출력 위치별(HTML 태그 사이/속성값/URL 등 값이 들어오는 곳) 인코딩
    implementation 'org.owasp.encoder:encoder:1.5.0'
}

test {
    // 기본 테스트는 DB와 Mailpit 연결 없이 실행함
    useJUnitPlatform {
        excludeTags 'integration', 'mail-integration'
    }
}

tasks.register('integrationTest', Test) {
    group = 'verification'
    description = 'DB 통합 테스트 실행'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform {
        includeTags 'integration'
        excludeTags 'mail-integration'
    }

    // DB 상태는 파일 변경과 관계없이 달라지므로 매번 실행함
    outputs.upToDateWhen { false }

    // 테스트 메서드가 실행되기 전에 검사
    doFirst {
        def url = System.getenv('DB_URL')
        def username = System.getenv('DB_USERNAME')
        def password = System.getenv('DB_PASSWORD')

        if (url != 'jdbc:mariadb://localhost:3308/smart_parking_test'
                || username != 'parking_test'
                || !password) {
            throw new GradleException('테스트 DB 접속 정보가 아니어서 실행을 중단함')
        }
    }
}
