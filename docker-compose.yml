services:
  db:
    image: mariadb:12.3.3
    restart: unless-stopped
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      TZ: ${TZ:-Asia/Seoul}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  flyway:
    image: flyway/flyway:13.7.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:mariadb://db:3306/${MARIADB_DATABASE}
      FLYWAY_USER: ${MARIADB_USER}
      FLYWAY_PASSWORD: ${MARIADB_PASSWORD}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql/migration,filesystem:/flyway/sql/local
      FLYWAY_CONNECT_RETRIES: 60
    volumes:
      - ./src/main/resources/db/migration:/flyway/sql/migration:ro
      - ./docker/flyway/local:/flyway/sql/local:ro
    command: migrate
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.31.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_WEB_PORT:-8025}:8025"
    environment:
      TZ: ${TZ:-Asia/Seoul}

volumes:
  db_data:
